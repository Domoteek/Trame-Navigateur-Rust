<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Nouvel onglet</title>
<style>
/* Provisoire : le vrai Nouvel onglet (écran 1, accès rapides du PC) viendra avec la synchro. */
:root { --fond:#080b11; --surface:#101521; --surface-2:#151c2a; --bord:rgba(255,255,255,.07); --bord-fort:rgba(255,255,255,.14);
  --texte:#e9eefa; --texte-2:#97a4bb; --texte-3:#616e85; --vif:#5eead4; --accent:#60a5fa; --dormant:#8b7cf6; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; background: radial-gradient(120% 60% at 50% 0%, rgba(96,165,250,.08), transparent 70%), var(--fond);
  color:var(--texte); font-family: Roboto, system-ui, sans-serif; padding: 28px 16px; display:grid; gap:20px; align-content:start; }
.logo { display:flex; align-items:center; gap:10px; font-weight:650; font-size:20px; margin-top:8px; }
.logo i { width:28px; height:28px; border-radius:8px; background: conic-gradient(from 200deg, var(--vif), var(--accent), var(--dormant), var(--vif)); }
form { display:flex; }
input { flex:1; height:46px; border-radius:23px; background:var(--surface-2); border:1px solid var(--bord-fort); color:var(--texte);
  padding:0 18px; font-size:15px; outline:none; }
input:focus { border-color: var(--accent); }
h2 { font-size:11.5px; color:var(--texte-3); text-transform:uppercase; letter-spacing:.06em; font-weight:600; margin:6px 0 0; }
.acces { display:grid; grid-template-columns: repeat(5, 1fr); gap:14px 6px; }
.acces a { display:grid; justify-items:center; gap:6px; font-size:11px; color:var(--texte-2); text-decoration:none; min-width:0; }
.acces a i { width:48px; height:48px; border-radius:15px; display:grid; place-items:center; font-style:normal; font-weight:700; font-size:17px;
  color:#fff; border:1px solid rgba(255,255,255,.08); }
.acces a span { max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
  <div class="logo"><i></i>Trame</div>
  <form id="f"><input id="q" type="search" placeholder="Rechercher ou saisir une adresse" autocomplete="off" enterkeyhint="go"></form>
  <h2>Accès rapides</h2>
  <div class="acces">
    <a href="https://m.youtube.com/"><i style="background:#b91c1c">Y</i><span>YouTube</span></a>
    <a href="https://mail.google.com/"><i style="background:#1d4ed8">G</i><span>Gmail</span></a>
    <a href="https://www.perplexity.ai/"><i style="background:#0f766e">P</i><span>Perplexity</span></a>
    <a href="https://www.amazon.fr/"><i style="background:#b45309">A</i><span>Amazon</span></a>
    <a href="https://vault.bitwarden.com/"><i style="background:#1e3a8a">B</i><span>Bitwarden</span></a>
  </div>
<script>
// Mêmes règles que la barre d'adresse (MainActivity.normaliser) et que Trame sur PC.
document.getElementById("f").addEventListener("submit", (e) => {
  e.preventDefault();
  const t = document.getElementById("q").value.trim();
  if (!t) return;
  let url;
  if (/^[a-z][a-z0-9+.-]*:\/\//i.test(t)) url = t;
  else if (!/\s/.test(t) && /^[^\s/]+\.[a-z]{2,}(:\d+)?(\/.*)?$/i.test(t)) url = "https://" + t;
  else url = "https://www.perplexity.ai/search?q=" + encodeURIComponent(t);
  location.href = url;
});
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>Trame</title>
    <link rel="stylesheet" href="chrome.css" />
  </head>
  <body>
    <!-- Jeu d'icones : traits de 1.7, viewBox 24, dessinees pour rester lisibles a 16 px.
         Un glyphe texte (« ⌾ », « ⌫ », « ◇ ») depend de la police, s'epaissit mal et ne
         s'aligne pas : ces symboles se dessinent. -->
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6" /></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></symbol>
      <symbol id="i-reload" viewBox="0 0 24 24">
        <path d="M20.5 12a8.5 8.5 0 1 1-2.5-6" /><path d="M20.5 3.5v5h-5" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5" /><path d="M20 20l-4.6-4.6" />
      </symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24">
        <path d="M4 7h16M4 12h16M4 17h16" />
        <circle cx="9" cy="7" r="2.2" /><circle cx="15" cy="12" r="2.2" /><circle cx="7.5" cy="17" r="2.2" />
      </symbol>
      <symbol id="i-blocks" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7.5" height="7.5" rx="1.6" />
        <rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6" />
        <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6" />
        <path d="M17.25 13.8v6.9M13.8 17.25h6.9" />
      </symbol>
      <symbol id="i-puzzle" viewBox="0 0 24 24">
        <path d="M9.5 3.5a2 2 0 0 1 4 0V6H17a1 1 0 0 1 1 1v3.5h1.5a2 2 0 0 1 0 4H18V18a1 1 0 0 1-1 1h-3.5v-1.5a2 2 0 0 0-4 0V19H6a1 1 0 0 1-1-1v-3.5h1.5a2 2 0 0 0 0-4H5V7a1 1 0 0 1 1-1h3.5z" />
      </symbol>
      <symbol id="i-replier" viewBox="0 0 24 24">
        <path d="M11 17l-5-5 5-5M18 17l-5-5 5-5" />
      </symbol>
      <symbol id="i-bouclier" viewBox="0 0 24 24">
        <path d="M12 3.2 5 6v5.6c0 4.3 3 7.8 7 9.2 4-1.4 7-4.9 7-9.2V6z" />
      </symbol>
      <symbol id="i-pin" viewBox="0 0 24 24">
        <path d="M9 3.5h6M10 3.5v5.2L7 13h10l-3-4.3V3.5M12 13v7.5" />
      </symbol>
      <symbol id="i-external" viewBox="0 0 24 24">
        <path d="M14 4h6v6M20 4l-8.5 8.5M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10" />
      </symbol>
      <symbol id="i-weave" viewBox="0 0 24 24">
        <path d="M3.5 8.5h17M3.5 15.5h17M8.5 3.5v17M15.5 3.5v17" />
      </symbol>
      <symbol id="i-capsule" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="5" rx="1.6" />
        <path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9" /><path d="M10 13.5h4" />
      </symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></symbol>
      <!-- Boutons de la fenetre : traits fins, comme ceux de Windows 11. -->
      <symbol id="i-f-reduire" viewBox="0 0 24 24"><path d="M6.5 12h11" /></symbol>
      <symbol id="i-f-agrandir" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.6" /></symbol>
      <symbol id="i-f-restaurer" viewBox="0 0 24 24">
        <rect x="6" y="8.5" width="9.5" height="9.5" rx="1.5" /><path d="M9 6h7.5A1.5 1.5 0 0 1 18 7.5V15" />
      </symbol>
      <symbol id="i-f-fermer" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" /></symbol>
      <symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14" /></symbol>
      <symbol id="i-son" viewBox="0 0 24 24">
        <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path d="M15.5 9a4 4 0 0 1 0 6" /><path d="M18 6.5a7.5 7.5 0 0 1 0 11" />
      </symbol>
      <symbol id="i-muet" viewBox="0 0 24 24">
        <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path d="M16 9.5l5 5M21 9.5l-5 5" />
      </symbol>
      <symbol id="i-folder" viewBox="0 0 24 24">
        <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.6l2 2.5H18.5A2.5 2.5 0 0 1 21 10v6.5A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z" />
      </symbol>
      <symbol id="i-sleep" viewBox="0 0 24 24">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" />
      </symbol>
      <symbol id="i-etoile" viewBox="0 0 24 24">
        <path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" />
      </symbol>
      <symbol id="i-points" viewBox="0 0 24 24">
        <circle cx="5.5" cy="12" r="1.3" /><circle cx="12" cy="12" r="1.3" /><circle cx="18.5" cy="12" r="1.3" />
      </symbol>
      <symbol id="i-imprimer" viewBox="0 0 24 24">
        <path d="M7 9V3.5h10V9M7 17.5H5A1.5 1.5 0 0 1 3.5 16v-5A1.5 1.5 0 0 1 5 9.5h14a1.5 1.5 0 0 1 1.5 1.5v5a1.5 1.5 0 0 1-1.5 1.5h-2" />
        <rect x="7" y="14" width="10" height="6.5" rx="1" />
      </symbol>
      <symbol id="i-horloge" viewBox="0 0 24 24">
        <circle cx="12" cy="13" r="7.5" /><path d="M12 9v4.2l2.8 1.8M9.5 2.8h5" />
      </symbol>
      <symbol id="i-cote" viewBox="0 0 24 24">
        <rect x="3.5" y="4.5" width="17" height="15" rx="2" /><path d="M12 4.5v15" />
      </symbol>
      <symbol id="i-cible" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="7.5" /><circle cx="12" cy="12" r="3" /><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3" />
      </symbol>
      <symbol id="i-livre" viewBox="0 0 24 24">
        <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15.5H5.5A1.5 1.5 0 0 1 4 18zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v15.5h5.5A1.5 1.5 0 0 0 20 18z" />
      </symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></symbol>
      <symbol id="i-zap" viewBox="0 0 24 24">
        <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" />
        <circle cx="12" cy="12" r="3" />
        <path d="M4 4l16 16" />
      </symbol>
    </svg>

    <!-- ------------------------------------------------------------- rail -->
    <div class="surface rail" id="rail" hidden>
      <!-- Barre de la fenetre (reglage « Barre de la fenetre ») : bord du haut pour
           redimensionner, bande du style « bandeau ». Le reste glisse comme une barre de titre. -->
      <div class="bord-haut" data-bord="haut"></div>
      <div class="titre-fenetre titre-rail"></div>
      <header class="rail-tete">
        <div class="marque">
          <span class="glyphe" title="Trame — clic droit : les commandes"><svg viewBox="0 0 256 256" aria-hidden="true"><rect x="4" y="4" width="248" height="248" rx="56" fill="#141a22"/><path d="M128 180 C 128 212, 162 220, 192 200" fill="none" stroke="#9b6cff" stroke-width="18" stroke-linecap="round"/><line x1="128" y1="80" x2="128" y2="184" stroke="#3fd9c0" stroke-width="44" stroke-linecap="round"/><line x1="98" y1="78" x2="158" y2="78" stroke="#141a22" stroke-width="60"/><line x1="52" y1="78" x2="204" y2="78" stroke="#5aa2ff" stroke-width="44" stroke-linecap="round"/></svg></span>
          <span class="nom-marque">Trame</span>
        </div>
        <button class="rond" id="btn-nouvel" title="Nouvel onglet (Ctrl+T)">
          <svg class="ic"><use href="#i-plus" /></svg>
        </button>
        <button class="rond accent" id="btn-trame-vue" title="Vue Trame (Ctrl+Espace)">
          <svg class="ic"><use href="#i-weave" /></svg>
        </button>
        <button class="rond" id="btn-rail" title="Replier le menu (Ctrl+B)">
          <svg class="ic"><use href="#i-replier" /></svg>
        </button>
        <div class="pastilles" id="pastilles">
          <button class="pastille reduire" data-fenetre="reduire" title="Réduire"></button>
          <button class="pastille agrandir" data-fenetre="agrandir" title="Agrandir"></button>
          <button class="pastille fermer" data-fenetre="fermer" title="Fermer"></button>
        </div>
      </header>

      <div class="suggestion" id="suggestion" hidden>
        <div class="txt" id="suggestion-txt"></div>
        <div class="rangee">
          <button id="suggestion-oui">Tisser</button>
          <button class="ghost" id="suggestion-non">Plus tard</button>
        </div>
      </div>

      <div class="bande-acces" id="bande-acces"></div>

      <div class="fils" id="fils"></div>

      <div class="depot" id="depot" hidden>Déposer ici pour ouvrir un nouveau fil</div>

      <footer class="rail-pied">
        <div class="budget" id="budget">
          <span class="txt-budget" id="budget-txt">—</span>
          <span class="jauge-budget"><i id="budget-jauge" style="width: 0%"></i></span>
        </div>
        <div class="pied-actions">
          <button id="btn-veille" title="Endormir maintenant les onglets froids (leur page se ferme, l'onglet reste)">
            <svg class="ic petit"><use href="#i-sleep" /></svg><span>Veille</span>
          </button>
          <button id="btn-capsules" title="Capsules : les fils mis de côté dans un fichier">
            <svg class="ic petit"><use href="#i-capsule" /></svg><span>Capsules</span>
          </button>
        </div>
      </footer>

      <div class="volet" id="volet" hidden>
        <h3 id="volet-titre">Capsules</h3>
        <div id="volet-corps"></div>
        <button class="volet-fermer" id="volet-fermer">fermer</button>
      </div>
    </div>

    <!-- ------------------------------------------------------------ barre -->
    <div class="surface barre" id="barre" hidden>
      <div class="bord-haut" data-bord="haut"></div>
      <div class="titre-fenetre titre-barre">
        <span class="titre-texte" id="titre-texte"></span>
        <div class="boutons-fenetre petits"></div>
      </div>
      <div class="barre-ligne">
        <button class="nav" id="btn-retour" title="Précédent (Alt+←)">
          <svg class="ic"><use href="#i-left" /></svg>
        </button>
        <button class="nav" id="btn-avant" title="Suivant (Alt+→)">
          <svg class="ic"><use href="#i-right" /></svg>
        </button>
        <button class="nav" id="btn-recharger" title="Recharger (Ctrl+R)">
          <svg class="ic"><use href="#i-reload" /></svg>
        </button>

        <div class="couture">
          <svg class="ic loupe"><use href="#i-search" /></svg>
          <input
            id="couture"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="Chercher un onglet, un fil, une adresse — ou › pour les commandes"
          />
          <span class="astuce">Ctrl+K</span>
          <button class="etoile" id="btn-favori" title="Ajouter aux favoris (Ctrl+D)">
            <svg class="ic"><use href="#i-etoile" /></svg>
          </button>
        </div>
        <button class="nav" id="btn-page" title="Cette page : rendez-vous, côte à côte, guet, impression…">
          <svg class="ic"><use href="#i-points" /></svg>
          <span class="badge" id="page-badge" hidden>0</span>
        </button>

        <!-- Extensions Chrome epinglees : une icone chacune, juste avant le puzzle, comme
             dans Chrome. Un clic ouvre sa fenetre d'action dans le panneau de droite. -->
        <!-- Telechargements : anneau de progression autour de la fleche pendant un
             telechargement, nombre en cours en pastille ; un clic ouvre la page. -->
        <button class="nav" id="btn-dl" title="Téléchargements (Ctrl+J)">
          <svg class="anneau-dl" viewBox="0 0 36 36" aria-hidden="true"><circle class="fond" cx="18" cy="18" r="15.5" /><circle class="avance" id="dl-avance" cx="18" cy="18" r="15.5" /></svg>
          <svg class="ic"><use href="#i-dl" /></svg>
          <span class="badge" id="dl-badge" hidden>0</span>
        </button>
        <div class="pin-chips" id="pin-chips" hidden></div>
        <button class="nav" id="btn-ext" title="Extensions">
          <svg class="ic"><use href="#i-puzzle" /></svg>
          <span class="badge" id="ext-badge" hidden>0</span>
        </button>
        <button class="nav" id="btn-zap" title="Masquer des éléments de la page (publicités, Shorts…)">
          <svg class="ic"><use href="#i-zap" /></svg>
        </button>
        <button class="nav" id="btn-reglages" title="Réglages : moteur, extensions, veille (Ctrl+,)">
          <svg class="ic"><use href="#i-sliders" /></svg>
        </button>
        <div class="boutons-fenetre bande"></div>
      </div>

      <div class="extbar" id="extbar" hidden>
        <button class="ext-chip ext-ajout" id="btn-dossier-ext" title="Ouvrir le dossier des extensions">
          <svg class="ic"><use href="#i-plus" /></svg>
        </button>
        <div class="ext-chips" id="ext-chips"></div>
        <button class="moteur-chip" id="btn-moteur" title="Changer de moteur de recherche">
          <svg class="ic"><use href="#i-search" /></svg>
          <span class="moteur-nom" id="moteur-nom">—</span>
        </button>
      </div>

      <div class="panneau" id="panneau" hidden>
        <div class="resultats" id="resultats"></div>
        <div class="extensions" id="extensions" hidden></div>
        <div class="extensions" id="menu-page" hidden></div>
        <div class="extensions" id="menu-commandes" hidden></div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="chrome.js"></script>
  </body>
</html>

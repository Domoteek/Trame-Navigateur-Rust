<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Trame — spike</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
        background: #0d1016;
        color: #e8ecf4;
        user-select: none;
      }
      .bar {
        height: 100%;
        display: grid;
        grid-template-rows: 34px 1fr;
      }
      .tabs {
        display: flex;
        align-items: flex-end;
        gap: 4px;
        padding: 4px 8px 0;
        background: #0a0c11;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0 14px;
        border-radius: 8px 8px 0 0;
        background: #161b26;
        font-size: 12px;
        color: #aeb8c9;
      }
      .tab.actif {
        background: #0d1016;
        color: #fff;
        box-shadow: inset 0 1px 0 #3b82f6;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        background: #0d1016;
        border-top: 1px solid #1b2130;
      }
      .url {
        flex: 1;
        height: 30px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        border-radius: 15px;
        background: #161b26;
        border: 1px solid #222a3a;
        font-size: 12px;
        color: #c9d3e3;
      }
      button {
        font: inherit;
        font-size: 12px;
        color: #e8ecf4;
        background: #1c2333;
        border: 1px solid #2a3346;
        border-radius: 8px;
        padding: 5px 10px;
        cursor: pointer;
      }
      button:hover {
        background: #253048;
      }
      #debug {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 11px;
        color: #7ee0a1;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="tabs">
        <div class="tab actif">Trame</div>
        <div class="tab">spike</div>
      </div>
      <div class="toolbar">
        <button id="ping">Envoyer un IPC</button>
        <div class="url">https://example.com</div>
        <span id="debug">en attente</span>
      </div>
    </div>
    <script>
      // Test sans clic : la page s'annonce jusqu'a recevoir une reponse (handshake).
      let recu = false;
      let essais = 0;
      const annonce = () => {
        if (recu) return;
        essais += 1;
        const el = document.getElementById("debug");
        try {
          window.ipc.postMessage(JSON.stringify({ m: "uiReady", essai: essais }));
          el.textContent = "ipc envoye x" + essais;
        } catch (e) {
          el.textContent = "ipc ABSENT: " + e.message;
        }
      };
      window.trameDebug = (msg) => {
        recu = true;
        document.getElementById("debug").textContent = "recu: " + msg;
      };
      annonce();
      const timer = setInterval(() => {
        if (recu) {
          clearInterval(timer);
          return;
        }
        if (essais >= 20) {
          clearInterval(timer);
          document.getElementById("debug").textContent = "aucune reponse (20 essais)";
          return;
        }
        annonce();
      }, 700);
    </script>
  </body>
</html>
